[package]
name = "code-snippets"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "=0.40.0"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "default-themes"] }
ttf-parser = "0.25"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"

[workspace]

[build-dependencies]
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "yaml-load", "dump-create"] }
