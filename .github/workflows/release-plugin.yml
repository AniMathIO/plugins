name: Release plugin
# Tag <plugin-id>@<version> (or run manually with the plugin directory) to build a plugin
# hosted in this repository and publish `<id>-<version>.amplugin` plus its `.sha256`.
# The tag must be on main, the plugin must be listed in community-plugins.json and its
# plugin.toml must carry exactly that id and version. Versions are immutable: a release
# that exists is never replaced.
on:
  push:
    tags:
      - "*@*"
  workflow_dispatch:
    inputs:
      path:
        description: "Plugin directory to release, e.g. community/code-snippets (version from its plugin.toml)"
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      ANIMATHIO_AUDIO: none
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Only release what is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - name: Install tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          rustup toolchain install stable --profile minimal --target wasm32-wasip2
          rustup default stable
      - name: Resolve the plugin from the registry
        id: plugin
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 scripts/registry.py resolve --tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/registry.py resolve --path "$INPUT_PATH" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Refuse to replace an existing release
        env:
          TAG: ${{ steps.plugin.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists; bump the version in plugin.toml"
            exit 1
          fi
      - name: Build and package
        env:
          PLUGIN_PATH: ${{ steps.plugin.outputs.path }}
        run: python3 scripts/registry.py package "$PLUGIN_PATH" --out dist
      - name: Released AniMathIO CLI
        id: cli
        uses: ./.github/actions/animathio-cli
        with:
          github-token: ${{ github.token }}
      - name: Load and render with the released CLI
        env:
          PLUGIN_ID: ${{ steps.plugin.outputs.id }}
        run: python3 scripts/registry_smoke.py "${{ steps.cli.outputs.cli }}" dist --only "$PLUGIN_ID"
      - name: Publish the release
        env:
          TAG: ${{ steps.plugin.outputs.tag }}
          PLUGIN_ID: ${{ steps.plugin.outputs.id }}
          VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          sha=$(cut -d' ' -f1 "dist/$PLUGIN_ID-$VERSION.amplugin.sha256")
          printf '%s %s\n\nSHA-256: `%s`\n\nInstall from the Plugins tab in AniMathIO 2.2+ (Browse), or download the .amplugin into your user plugin folder. See the README for details.\n' \
            "$PLUGIN_ID" "$VERSION" "$sha" > notes.md
          gh release create "$TAG" dist/*.amplugin dist/*.amplugin.sha256 \
            --target "$GITHUB_SHA" --title "$PLUGIN_ID $VERSION" --notes-file notes.md --latest=false
  index:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/index.yml
