name: Community index
# Regenerates community-index.json (the single static file the editor reads) from
# community-plugins.json and the GitHub releases it points at. See docs/registry.md.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Plugins released from their own repositories are picked up within hours.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - community-plugins.json
      - schemas/community-index.schema.json
      - scripts/registry.py
concurrency:
  group: community-index
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Regenerate community-index.json
        env:
          GH_TOKEN: ${{ github.token }}
        # Not strict: a plugin whose release cannot be verified keeps its previous entry
        # (or is left out) and a warning annotation is raised; the other plugins still update.
        run: python3 scripts/registry.py index
      - name: Commit the index
        run: |
          if git diff --quiet -- community-index.json; then
            echo "community-index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-index.json
          git commit -m "chore(registry): update community-index.json"
          git push origin HEAD:main
