name: Community index
# Regenerates community-index.json (the single static file the editor reads) from
# community-plugins.json and the GitHub releases it points at. See docs/registry.md.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Plugins released from their own repositories are picked up within hours.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - community-plugins.json
      - schemas/community-index.schema.json
      - scripts/registry.py
concurrency:
  group: community-index
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Regenerate community-index.json
        env:
          GH_TOKEN: ${{ github.token }}
        # Not strict: a plugin whose release cannot be verified keeps its previous entry
        # (or is left out) and a warning annotation is raised; the other plugins still update.
        run: python3 scripts/registry.py index
      - name: Upload the index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: community-index
          path: community-index.json
          if-no-files-found: error
  commit:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Only copy and commit data on this runner; no repository scripts or plugin code.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Download the index
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: community-index
          path: ${{ runner.temp }}/generated-index
      - name: Commit the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/generated-index/community-index.json" community-index.json
          if git diff --quiet -- community-index.json; then
            echo "community-index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-index.json
          git -c core.hooksPath=/dev/null commit -m "chore(registry): update community-index.json"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
