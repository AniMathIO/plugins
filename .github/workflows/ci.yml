name: Plugins
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      ANIMATHIO_AUDIO: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain and generator
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-wasip2
          rustup default stable
          cargo install cargo-generate --version 0.26.0 --locked
      - name: Generate template
        run: mkdir -p .generated && cargo generate --path template --name generated-circle --destination .generated --silent --define plugin-id=org.example.generated-circle --define plugin-name=GeneratedCircle --define author=CI
      - name: Build and package every plugin
        run: |
          mkdir -p target/plugins
          for dir in .generated/generated-circle examples/* community/*; do
            cargo fmt --manifest-path "$dir/Cargo.toml" --check
            cargo clippy --manifest-path "$dir/Cargo.toml" --target wasm32-wasip2 --locked -- -D warnings
            cargo test --manifest-path "$dir/Cargo.toml" --workspace --locked
            bash "$dir/build.sh"
            cp "$dir"/target/*.amplugin target/plugins/
          done
      - name: Test released host rendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0 --repo AniMathIO/AniMathIO --pattern '*amd64.deb' --dir .host
          echo 'c5e4ff74fca524c1f6e9d4223e42df05e1d4cbd3d27c5ceb7bf372e69d4f1965  .host/animathio_2.0.0_amd64.deb' | sha256sum -c -
          dpkg-deb -x .host/*.deb .host/extracted
          python3 -m pip install Pillow
          python3 scripts/smoke.py .host/extracted/usr/bin/animathio-cli target/plugins
      - name: Test Code Snippets on released 2.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.1.0 --repo AniMathIO/AniMathIO --pattern '*AppImage' --dir .host/code-snippets
          echo 'cce18dd8215aa9c23ba7c5756e6c0785c1931dd027aadf31a7bbbf3b92fac6ec  .host/code-snippets/animathio_2.1.0_x86_64.AppImage' | sha256sum -c -
          chmod +x .host/code-snippets/*.AppImage
          (cd .host/code-snippets && ./animathio_2.1.0_x86_64.AppImage --appimage-extract > /dev/null)
          python3 community/code-snippets/smoke.py .host/code-snippets/squashfs-root/usr/bin/animathio-cli target/plugins
      - name: Get released AniMathIO 2.3.0
        id: host-2-3-0
        uses: ./.github/actions/animathio-cli
        with:
          github-token: ${{ github.token }}
          tag: v2.3.0
          asset: animathio_2.3.0_x86_64.AppImage
          sha256: ca7d4e613a7ec049bdb9aa8ecf6fc63ddae2ce10c70b2ec26632569a9ebdd148
      - name: Test Molecule Studio on released 2.3.0
        env:
          ANIMATHIO_CLI: ${{ steps.host-2-3-0.outputs.cli }}
        run: python3 community/molecule/smoke.py "$ANIMATHIO_CLI" target/plugins
      - name: Test Ray Optics on released 2.3.0
        env:
          ANIMATHIO_CLI: ${{ steps.host-2-3-0.outputs.cli }}
        run: python3 community/optics/smoke.py "$ANIMATHIO_CLI" target/plugins
      - name: Test Net Lab on released 2.3.0
        env:
          ANIMATHIO_CLI: ${{ steps.host-2-3-0.outputs.cli }}
        run: python3 community/network/smoke.py "$ANIMATHIO_CLI" target/plugins
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins
          path: target/plugins/*.amplugin
